name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment
        run: |
          chmod +x ./gradlew || true
          
          # 1. Environment & Properties
          touch .env
          echo "GEMINI_API_KEY=dummy" >> .env
          touch secrets.properties
          echo "GEMINI_API_KEY=dummy" >> secrets.properties
          touch local.defaults.properties
          echo "GEMINI_API_KEY=dummy" >> local.defaults.properties
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          
          # 2. Keystore setup (password standard Android debug is 'android')
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          
          # 3. Generate google-services.json for all possible IDs
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-kaskelas",
              "storage_bucket": "dummy-kaskelas.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1",
                  "android_client_info": {
                    "package_name": "com.aistudio.kaskelas.wpmk"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef2",
                  "android_client_info": {
                    "package_name": "com.aistudio.kaskelas.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef3",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build APK with Gradle
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Find and Prepare APK for Release
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk -name "*.apk" -exec cp {} release-assets/KasKelas-v1.0.apk \;
          ls -la release-assets/

      - name: Generate Release Tag
        id: tag
        run: |
          TAG_NAME="v1.0.$(date +'%Y%m%d%H%M%S')"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Kas Kelas Release ${{ steps.tag.outputs.tag_name }}"
          body: |
            ### 📱 Aplikasi Kas Kelas (APK)
            
            Versi terbaru aplikasi Kas Kelas telah berhasil di-build secara otomatis oleh GitHub Actions.
            
            #### 📥 Cara Install:
            1. Unduh file **`KasKelas-v1.0.apk`** di bagian **Assets** di bawah.
            2. Buka dan pasang (install) di perangkat Android Anda.
            3. Jika muncul peringatan *"Install from unknown source"*, pilih **Izinkan (Allow)**.
          files: release-assets/KasKelas-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
