name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper & debug keystore
        run: |
          chmod +x ./gradlew
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/KasKelas-v1.0.apk
          ls -lh release-assets/KasKelas-v1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kas Kelas v1.0 (Build ${{ github.run_number }})
          make_latest: true
          body: |
            ## Kas Kelas v1.0

            Unduh file **KasKelas-v1.0.apk** di bagian **Assets** di bawah untuk langsung menginstal aplikasi di Android.

            ### Cara Install di HP Android:
            1. Unduh file `KasKelas-v1.0.apk`.
            2. Buka file `.apk` tersebut dari Notification bar atau File Manager.
            3. Jika diminta izin, aktifkan **Izinkan dari sumber ini (Install unknown apps)** lalu tekan **Install**.
          files: |
            release-assets/KasKelas-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
